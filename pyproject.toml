[project]
name = "travel-agent"
version = "0.1.0"
description = "AI-powered travel planning platform — Phase 1: Basic Travel Planner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "openai>=1.40",
    "tenacity>=8.3",
    "structlog>=24.1",
    "email-validator>=2.0",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "pypdf>=4.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.19",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 128
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["app"]
